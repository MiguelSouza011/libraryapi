name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  unit-quality:
    name: Unit, MockMvc and JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and controller tests
        run: ./mvnw -B -ntp clean verify -Dskip.integration.tests=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: libraryapi
          POSTGRES_USER: libraryapi
          POSTGRES_PASSWORD: libraryapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraryapi -d libraryapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/libraryapi
      DB_USERNAME: libraryapi
      DB_PASSWORD: libraryapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run PostgreSQL integration tests
        run: ./mvnw -B -ntp -Pintegration -Dspring.profiles.active=integration clean verify

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: target/failsafe-reports/
          if-no-files-found: warn