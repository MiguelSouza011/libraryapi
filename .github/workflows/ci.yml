name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

permissions:
  contents: read

jobs:
  unit-quality:
    name: Unit, MockMvc and JaCoCo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run unit and controller tests
        run: ./mvnw -B -ntp clean verify -Dskip.integration.tests=true

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: warn

  postgres-integration:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: libraryapi
          POSTGRES_USER: libraryapi
          POSTGRES_PASSWORD: libraryapi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U libraryapi -d libraryapi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_URL: jdbc:postgresql://localhost:5432/libraryapi
      DB_USERNAME: libraryapi
      DB_PASSWORD: libraryapi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run PostgreSQL integration tests
        run: ./mvnw -B -ntp -Pintegration -Dspring.profiles.active=integration clean verify

      - name: Upload integration reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-reports
          path: target/failsafe-reports/
          if-no-files-found: warn

  deploy:
    name: Build and Deploy to AWS
    needs:
      - unit-quality
      - postgres-integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            duda1012/libraryapi:latest
            duda1012/libraryapi:${{ github.sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -eu
            
            IMAGE="duda1012/libraryapi:${{ github.sha }}"
            
            echo "Saving current image for rollback..."
            OLD_IMAGE_ID=$(sudo docker inspect --format='{{.Image}}' libraryapi)
            
            echo "Downloading new image..."
            sudo docker pull "$IMAGE"
            
            echo "Stopping old container..."
            sudo docker stop libraryapi
            sudo docker rm libraryapi
            
            echo "Starting new container..."
            if sudo docker run -d \
              --name libraryapi \
              --restart unless-stopped \
              -p 8080:8080 \
              -p 9090:9090 \
              --env-file /opt/libraryapi/.env \
              "$IMAGE"; then
            
              sleep 15
            
              if [ "$(sudo docker inspect -f '{{.State.Running}}' libraryapi)" = "true" ]; then
                echo "Deployment successful!"
                exit 0
              fi
            fi
            
            echo "Deployment failed. Restoring previous version..."
            
            sudo docker rm -f libraryapi 2>/dev/null || true
            
            sudo docker run -d \
              --name libraryapi \
              --restart unless-stopped \
              -p 8080:8080 \
              -p 9090:9090 \
              --env-file /opt/libraryapi/.env \
              "$OLD_IMAGE_ID"
            
            echo "Previous version restored."
            exit 1