spring:
  application:
    name: libraryapi
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      pool-name: library-db-pool
      max-lifetime: 600000
      connection-timeout: 100000
      connection-test-query: select 1
  jpa:
    show-sql: true
    hibernate:
    #  ddl-auto: update
      ddl-auto: none
    properties:
      hibernate.format_sql: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}

logging:
  file:
    name: app.log
  level:
    root: warn

springdoc:
  override-with-generic-response: false